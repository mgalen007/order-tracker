spring.application.name=order-tracker

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderapp}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Server configuration
server.port=${PORT:8080}
